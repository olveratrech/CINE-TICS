name: Verify Java baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Cine/pom.xml
      - name: Verify clean build and characterization tests
        working-directory: Cine
        run: ./mvnw -B -ntp clean verify
      - name: Verify console startup without historical data
        run: python3 scripts/smoke_console.py
