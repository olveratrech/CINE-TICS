spring.application.name=cine-tics
server.address=127.0.0.1
server.port=${CINE_WEB_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CINE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${CINE_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-parameter-count=20
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
